<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>事例Ⅰ〜Ⅲ 頭文字フレームワークドリル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --paper:#F5EFE1;
    --paper-dark:#EDE4CE;
    --line:#CFC3A3;
    --ink:#26314A;
    --ink-soft:#5B5747;
    --red:#A23B2E;
    --moss:#4B6B4E;
    --gold:#B08A3E;
    --card-shadow: 0 1px 0 rgba(38,49,74,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line) 28px),
      var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    min-height:100vh;
    padding:18px 14px 60px;
  }

  .wrap{max-width:480px; margin:0 auto;}

  /* ---- Header / tape ---- */
  header{
    text-align:center;
    padding:6px 0 14px;
  }
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--gold);
    text-transform:uppercase;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:26px;
    margin:4px 0 2px;
    color:var(--ink);
  }
  .sub{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  .back-link{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:10px;
  }
  .back-link:active{ color:var(--ink); }

  .tape{
    margin-top:14px;
    background:#FBF8EF;
    border:1px solid var(--line);
    border-radius:2px;
    padding:10px 12px;
    font-family:'Space Mono', monospace;
    font-size:13px;
    color:var(--ink-soft);
    position:relative;
    box-shadow: var(--card-shadow);
  }
  .tape::before, .tape::after{
    content:"";
    position:absolute; left:0; right:0; height:6px;
    background-image: linear-gradient(45deg, var(--paper) 50%, transparent 50%), linear-gradient(-45deg, var(--paper) 50%, transparent 50%);
    background-size: 10px 6px; background-repeat:repeat-x;
  }
  .tape::before{ top:-6px; background-position: 0 6px;}
  .tape::after{ bottom:-6px; transform:rotate(180deg);}
  .tape-row{display:flex; justify-content:space-between; align-items:center;}
  .tape-marks{letter-spacing:3px; font-size:15px;}
  .tape-marks .ok{color:var(--moss);}
  .tape-marks .ng{color:var(--red);}
  .tape-rate{font-weight:700; color:var(--ink);}

  /* ---- Tabs ---- */
  .tabs{
    display:flex; flex-wrap:wrap; gap:6px;
    margin:16px 0 10px;
  }
  .tab{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:12.5px;
    padding:6px 10px;
    border:1px solid var(--line);
    background:var(--paper-dark);
    color:var(--ink-soft);
    border-radius:3px;
    cursor:pointer;
    user-select:none;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }
  .tab .cnt{opacity:.65; font-size:10.5px; margin-left:2px;}

  /* ---- Session buttons ---- */
  .session-row{display:flex; gap:8px; margin:6px 0 18px;}
  .sbtn{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size:13px;
    padding:10px 4px;
    text-align:center;
    background:var(--paper);
    border:1px solid var(--ink);
    color:var(--ink);
    border-radius:3px;
    cursor:pointer;
  }
  .sbtn:active{ background:var(--ink); color:var(--paper); }
  .sbtn b{display:block; font-size:16px;}
  .sbtn span{font-size:9.5px; color:var(--ink-soft); font-family:'Zen Kaku Gothic New',sans-serif;}

  /* ---- Card ---- */
  .stage{ min-height:340px; }
  .card{
    background:#FBF8EF;
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 20px 18px;
    box-shadow: var(--card-shadow);
    position:relative;
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'Space Mono', monospace;
    font-size:11px; color:var(--gold);
    letter-spacing:.06em;
    margin-bottom:14px;
  }
  .progress{ font-size:11px; color:var(--ink-soft); }
  .qlabel{
    font-family:'Space Mono', monospace;
    font-size:11px; color:var(--ink-soft); margin-bottom:6px;
  }
  .qtext{
    font-family:'Shippori Mincho', serif;
    font-size:18px;
    line-height:1.65;
    color:var(--ink);
    min-height:70px;
  }
  .divider{
    border:none; border-top:1px dashed var(--line);
    margin:16px 0;
  }
  .answer{
    display:none;
  }
  .answer.show{ display:block; }
  .alabel{
    font-family:'Space Mono', monospace;
    font-size:11px; color:var(--red); margin-bottom:6px;
  }
  .atext{
    font-size:15px; line-height:1.7; color:var(--ink);
    background:var(--paper-dark);
    border-left:3px solid var(--red);
    padding:10px 12px;
    border-radius:2px;
  }
  .tip{
    margin-top:10px; font-size:12.5px; color:var(--ink-soft); line-height:1.6;
  }

  .reveal-btn{
    width:100%; margin-top:16px;
    background:var(--ink); color:var(--paper);
    border:none; border-radius:3px;
    padding:13px; font-size:14px; font-weight:700;
    font-family:'Zen Kaku Gothic New', sans-serif;
    cursor:pointer;
  }

  .judge-row{
    display:flex; gap:10px; margin-top:14px;
  }
  .jbtn{
    flex:1; padding:12px; border-radius:3px; border:1px solid var(--line);
    font-size:14px; font-weight:700; cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
    background:var(--paper);
  }
  .jbtn.ok{ color:var(--moss); border-color:var(--moss); }
  .jbtn.ng{ color:var(--red); border-color:var(--red); }
  .jbtn.ok:active{ background:var(--moss); color:#fff; }
  .jbtn.ng:active{ background:var(--red); color:#fff; }

  .done-card{
    text-align:center; padding:36px 20px;
  }
  .done-card .big{
    font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:var(--ink);
  }
  .done-card p{ color:var(--ink-soft); font-size:13px; margin-top:6px;}
  .restart{
    margin-top:18px; width:100%;
    background:var(--paper); border:1px solid var(--ink); color:var(--ink);
    padding:12px; border-radius:3px; font-weight:700; cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }

  .weak-box{
    margin-top:22px; background:var(--paper-dark); border:1px solid var(--line);
    border-radius:4px; padding:14px 16px;
  }
  .weak-box h2{
    font-family:'Shippori Mincho', serif; font-size:14px; margin:0 0 8px;
  }
  .weak-item{
    display:flex; justify-content:space-between; font-size:12.5px;
    padding:5px 0; border-bottom:1px dotted var(--line); color:var(--ink-soft);
  }
  .weak-item:last-child{border-bottom:none;}
  .weak-item b{color:var(--red);}

  .opt-row{ margin:2px 0 12px; }
  .opt-toggle{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--ink-soft); cursor:pointer; user-select:none;
  }
  .opt-toggle input{ accent-color:var(--ink); width:15px; height:15px; }

  .sync-box{
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
  }
  .sync-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size:11.5px;
    padding:7px 10px; background:var(--paper); border:1px solid var(--line);
    color:var(--ink-soft); border-radius:3px; cursor:pointer;
  }
  .sync-btn:active{ background:var(--paper-dark); }
  .sync-area{
    width:100%; margin-top:2px; font-family:'Space Mono', monospace; font-size:10.5px;
    padding:8px; border:1px solid var(--line); border-radius:3px; background:#FBF8EF; color:var(--ink);
    resize:vertical;
  }
  .sync-msg{ font-size:11px; color:var(--moss); }

  footer{
    text-align:center; margin-top:26px; font-size:10.5px; color:var(--ink-soft);
    font-family:'Space Mono', monospace;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="back-link" href="index.html">← ドリル一覧に戻る</a>
    <div class="eyebrow">FRAMEWORK DRILL</div>
    <h1>頭文字フレームワークドリル</h1>
    <div class="sub">事例Ⅱの「ダナドコ」「けちのしぶき」「施策あるある5」を一問一答で。</div>
  </header>

  <div class="tape">
    <div class="tape-row">
      <span id="tapeMarks" class="tape-marks">まだ記録がありません</span>
      <span id="tapeRate" class="tape-rate">--%</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="opt-row">
    <label class="opt-toggle"><input type="checkbox" id="weakOnlyToggle"> 苦手優先モード（習得済み[連続2回正解]の問題を除外）</label>
  </div>
  <div class="opt-row">
    <label class="opt-toggle"><input type="checkbox" id="newestFirstToggle"> 新しい問題から解く（追加順・シャッフルなし）</label>
  </div>

  <div class="session-row">
    <div class="sbtn" data-n="5"><b>5問</b><span>約3分</span></div>
    <div class="sbtn" data-n="10"><b>10問</b><span>約5〜7分</span></div>
    <div class="sbtn" data-n="99"><b>全問</b><span>カテゴリ集中</span></div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="weak-box" id="weakBox" style="display:none;">
    <h2>苦手リスト（正答率が低い順）</h2>
    <div id="weakList"></div>
  </div>

  <div class="sync-box">
    <button class="sync-btn" id="exportBtn">📤 進捗をエクスポート</button>
    <button class="sync-btn" id="importBtn">📥 進捗をインポート</button>
    <textarea class="sync-area" id="syncArea" style="display:none;" rows="3" placeholder="ここに進捗JSONを貼り付けて「読み込む」を押す"></textarea>
    <button class="sync-btn" id="syncApplyBtn" style="display:none;">読み込む</button>
    <span class="sync-msg" id="syncMsg"></span>
  </div>

  <footer>頭文字フレームワーク集をもとに作成 &middot; 記録は端末(localStorage)に保存されます。新しいバージョンをもらったら「進捗をエクスポート」→次のバージョンで「進捗をインポート」で引き継げます。</footer>
</div>

<script>
// ---------------- Question bank ----------------
const BANK = [
  // ダナドコ基礎
  {cat:'danadoko', q:'ダナドコとは何の頭文字か？', a:'誰に・何を・どのように・効果', tip:'事例Ⅱの助言問題における解答骨格。'},
  {cat:'danadoko', q:'設問文にダナドコの要素（例：ターゲット）が既に明示されている場合の対応は？', a:'重複を避けるため、その要素は解答に書かなくてよい（文字数対策）', tip:''},
  {cat:'danadoko', q:'「誰に」（ターゲット）を検討する4つの切り口は？', a:'デモ（人口動態的変数）・ジオ（地理的変数）・サイコ（心理的変数）・行動変数', tip:''},
  {cat:'danadoko', q:'「どのように」を書く際に使う基本フレームは？', a:'4P（Product製品・Price価格・Place チャネル・Promotion販促）', tip:''},
  {cat:'danadoko', q:'「効果」を書く際に意識すべき基本方向性は？', a:'売上向上、または与件文の弱み・脅威の解消につなげる', tip:''},

  // けちのしぶき／経営資源
  {cat:'kechi', q:'強み（経営資源）を洗い出す語呂合わせ「けちのしぶき」の7要素は？', a:'経験・知識・ノウハウ・こだわり・信頼・ブランド・技術', tip:''},
  {cat:'kechi', q:'「けちのしぶき」は主にダナドコのどの要素の根拠出しに使うか？', a:'「誰に」「どのように」を書く際の自社の強みの特定', tip:''},

  // 施策あるある5（サ・タカ・ブ・カン・クチ）
  {cat:'sakusaku', q:'事例Ⅱ施策あるある5の並び順（因果の流れ）は？', a:'差別化 → 高付加価値化 → ブランド化 → 関係性強化 → 口コミ・紹介', tip:'差別化した強みが付加価値を生み、ブランドとして認知され、関係が深まり口コミが広がる流れ。'},
  {cat:'sakusaku', q:'与件文に「価格競争が激化している」とあれば、まず疑う施策あるあるは？', a:'差別化', tip:''},
  {cat:'sakusaku', q:'与件文に「客単価が伸び悩んでいる／安売りをしている」とあれば？', a:'高付加価値化', tip:''},
  {cat:'sakusaku', q:'与件文に「知名度が低い／認知度不足」とあれば？', a:'ブランド化', tip:''},
  {cat:'sakusaku', q:'与件文に「新規顧客は獲得できるがリピートに繋がらない」とあれば？', a:'関係性強化（固定客化）', tip:''},
  {cat:'sakusaku', q:'与件文に「満足度は高いが紹介や口コミが少ない」とあれば？', a:'口コミ・紹介', tip:''},
  {cat:'sakusaku', q:'施策あるある5と4Pの役割の違いは？', a:'4Pは「どのように（手段）」の切り口、施策あるある5は「効果・着地点」の切り口。両者は補完関係にある', tip:''},

  // 経多シリ（事例Ⅰ・経営戦略レイヤー）
  {cat:'keitashiri', q:'事例Ⅰで新規事業・多角化の検討が出てくる設問で意識する語呂合わせ「経多シリ」の4要素は？', a:'経営資源（既存の強みの転用）・多角化・シナジー・リスク分散', tip:'「幸の日も毛深い猫」は組織構造・活性化・人的資源管理のみで経営戦略レイヤー（ビジョン・社長の想い）を含まないため、新規事業・事業ドメイン再定義が絡む設問では経多シリで補う。'},
  {cat:'keitashiri', q:'事業ドメインの再定義を助言する設問で、主力だが先行き不透明な既存事業の扱いに一言も触れないと、経多シリのどの要素が抜けるか？', a:'シナジー・リスク分散', tip:'2026-10-04精密ばね製造業「東陽スプリング」の演習で、医療機器向け新事業への差別化・ドメイン再定義は的確に書けたが、売上7割を占める既存の自動車事業（巻線技術という中核資源を共有）の扱いに触れず、既存資源をどう転用するか（シナジー）、単一事業依存をどう減らすか（リスク分散）の視点が抜けた。'},
  {cat:'keitashiri', q:'「経多シリ」のうち、新事業で使う技術・設備・顧客基盤が既存事業と共通する場合に特に意識すべき要素は？', a:'シナジー', tip:'既存の中核的経営資源（技術・ノウハウ等）を新事業にどう転用できるか、という視点。'},
  {cat:'keitashiri', q:'「経多シリ」のうち、主力事業の先行きが不透明（需要縮小・市場変化等）な場合に多角化を正当化する要素は？', a:'リスク分散', tip:'単一事業・単一顧客への依存を減らし、経営の安定性を高める視点。'},

  // 設問形式の見分け（整理・特徴型 vs 助言・提案型）
  {cat:'keishiki', q:'「整理せよ」「特徴を述べよ」のような設問で書くべきことは？', a:'与件文に書かれている事実をそのまま要約・構造化すること。自分の解釈や提案を混ぜてはいけない', tip:'2026-10-04事例Ⅰ(三陸精密ねじ工業)で、与件が「技能承継が課題」と未解決の課題として提示している部分を、「新卒採用で技能承継を進めている」という与件にない能動的な取組として書いてしまい減点された。'},
  {cat:'keishiki', q:'「助言せよ」「提案せよ」のような設問で書くべきことは？', a:'与件文の事実（課題・ギャップ）＋診断士としての打ち手（提案）を書くこと', tip:'整理・特徴型とは解答の作り方が異なるので、設問文の動詞を見てどちらの型かを解答前に必ず判定する。'},

  // 留意点型（業務提携・取引拡大・M&A等の意思決定に先立つ留意点）
  {cat:'ryuiten', q:'「留意点型」設問(業務提携・取引拡大前の留意点を問う)で確認すべき4つの軸は？', a:'①依存度・集中リスク ②契約条件の確認 ③既存事業・顧客への影響 ④投資回収可能性', tip:'ダナドコ等と違い確立された語呂合わせはないが、R3経営統合前/R4大手中食業者との取引・依存リスク/R5経営統合前/H28新規事業拡大など過去問から整理した4軸。'},
  {cat:'ryuiten', q:'留意点型の設問で、4つの軸をどう使って解答を組み立てる？', a:'与件文が①〜④のどの軸に対応する具体的事実(依存度の数値、投資額、契約の有無等)を含んでいるかを特定し、該当する1〜2軸を与件の事実に即して厚く書く。全軸を薄く並べない', tip:'与件が与えたヒント(具体的な数値・事実)に忠実な軸を優先する。'},
  {cat:'ryuiten', q:'留意点型の設問を解くときの具体的な手順(自問自答型)は？', a:'与件文中のトリガーとなる事実を1つずつ取り出し、それぞれに「〇〇すると、(対象)との関係のどのような点に留意するべきか」と自問して、対応する軸の留意点を答える。これを事実の数だけ繰り返し、最後に矢印・箇条書きを外して一文につなげる', tip:'例(気仙沼精工): 「P社の売上高比率が高くなると→発注方針変更や契約終了時の経営への影響が大きくなる点」「専用ラインを作ると→投資額が大きく発注継続が前提となるため契約期間や最低保証量等の確認が必要な点」の2回の自問自答から模範解答を組み立てた。'},
  // ===== 解答の骨格(question-catalog.json の skeleton から生成、2026-10-05) =====
  {cat:'kokkaku', q:'SWOT型(事例Ⅰ・事例Ⅱ)の解答の骨格は？ 例:「〇〇における〇〇の状況について、SWOT分析をせよ。①〜④の解答欄にそれぞれ◯字以内で述べよ。」', a:'①S:〔強み=与件の経営資源〕 ②W:〔弱み〕 ③O:〔外部の機会〕 ④T:〔外部の脅威〕。各欄は体言止めで事実だけ、指定時点の情報だけ。', tip:'過去問: 事例ⅡR1〜R3・R6/事例ⅠR7'},
  {cat:'kokkaku', q:'強み・弱み型(事例Ⅰ・事例Ⅲ)の解答の骨格は？ 例:「〇〇の(a)強みと(b)弱みについて、それぞれ◯字以内で述べよ。」', a:'(a)強みは〔経営資源①〕と〔②〕。(b)弱みは〔状態①〕と〔②〕。事実だけ・体言止め。', tip:'過去問: 事例ⅠR5・R6/事例ⅢR2・R3・R7/事例ⅠR4(まとめて100字)'},
  {cat:'kokkaku', q:'強み列挙型(事例Ⅲ)の解答の骨格は？ 例:「〇〇の事業変遷を踏まえた上で、〇〇の強みを◯字以内で述べよ。」', a:'強みは、〔事業変遷で培った経営資源①〕と〔②〕による〔顧客への価値〕である。', tip:'過去問: 事例ⅢR1・R6'},
  {cat:'kokkaku', q:'3C分析型(事例Ⅱ)の解答の骨格は？ 例:「〇〇の現状について、3C(Customer:顧客、Competitor:競合、Company:自社)分析の観点から◯字以内で述べよ。」', a:'顧客は〔ニーズ・行動〕。競合は〔競合の強み・動き〕。自社は〔強み〕を持つ一方〔弱み〕。各カテゴリに与件の事実だけを振り分ける。', tip:'過去問: 事例ⅡH30・R4・R5・R7'},
  {cat:'kokkaku', q:'理由型(なぜ)(事例Ⅰ・事例Ⅱ・事例Ⅲ)の解答の骨格は？ 例:「〇〇を行ったのはなぜだと考えられるか。◯字以内で述べよ。」', a:'理由は、①〔与件の事実〕により〔効果〕を得るため、②〔与件の事実〕により〔効果〕を図るためである。', tip:'過去問: 事例ⅠR1〜R3・R6/事例ⅠH30(競争戦略の視点から・人員構成から)/事例ⅢH30業績を維持できた理由'},
  {cat:'kokkaku', q:'狙い型(事例Ⅰ・事例Ⅱ)の解答の骨格は？ 例:「〇〇の狙いは何か。◯字以内で述べよ。」', a:'狙いは、〔施策の直接効果〕により〔経営上の目的(売上拡大・競争力強化など)〕を図ることである。', tip:'過去問: 事例ⅠR5・R6/事例ⅠH30組織改編の目的'},
  {cat:'kokkaku', q:'成功要因型(事例Ⅰ・事例Ⅱ)の解答の骨格は？ 例:「〇〇が〇〇に成功した要因として、どのようなことが考えられるか。◯字以内で述べよ。」', a:'要因は、①〔強み・取組み〕により〔顧客の評価〕を得たこと、②〔取組み〕により〔効果〕を実現したことである。', tip:'過去問: 事例ⅠR1/事例ⅠH28成長できた要因・新規事業が成果を上げられなかった要因/H29再び人気商品にした最大の要因'},
  {cat:'kokkaku', q:'手順・取り組み説明型(事例Ⅰ・事例Ⅱ)の解答の骨格は？ 例:「〇〇は〇〇をどのような手順で進めたと考えられるか。◯字以内で述べよ。」', a:'〔第1段階の取組み〕を行ったうえで〔第2段階〕を進め、〔第3段階〕により〔効果〕を実現した。', tip:'過去問: 事例ⅠR2情報システム化の手順/R7顧客接点の取り組み'},
  {cat:'kokkaku', q:'利点・欠点型(事例Ⅰ・事例Ⅲ・事例Ⅱ)の解答の骨格は？ 例:「〇〇は、〇〇にどのような利点と欠点をもたらしたと考えられるか。◯字以内で述べよ。」', a:'利点は、〔与件根拠〕による〔効果〕。欠点は、〔与件根拠〕による〔悪影響〕。', tip:'過去問: 事例ⅠR3/事例ⅠH29工業団地移転の戦略的メリット/事例ⅡH28飲食店直営のメリットと効果'},
  {cat:'kokkaku', q:'利点・欠点型で、与件文に欠点を示す一文が見当たらない場合、どうする？', a:'探すのをやめて自分で裏返す。決定による管理の対比(ざっくり→細かい、感覚→データ化など)から「それをやることで何を失うか・何のコストがかかるか」を補う。片方だけ書いて終わらない', tip:'2026-10-09 D社(個別製品単位の原価管理システム導入)の演習で、利点(E社への価格交渉力向上)だけ書いて欠点を書き忘れ9/20点。与件には欠点の明示文はなかったが、「製品群単位→個別製品単位」「感覚依存→データ記録」という対比から、管理の手間・運用コスト増という裏返しを自分で補うべきだった。'},
  {cat:'kokkaku', q:'効果とリスク型(事例Ⅰ・事例Ⅲ)の解答の骨格は？ 例:「〇〇が〇〇に応じる場合、〇〇における〇〇での効果とリスクを◯字以内で述べよ。」', a:'効果は、〔与件根拠〕による〔生産面/組織面の効果〕。リスクは、〔与件根拠〕による〔直接的な悪影響〕が〔経営への帰結〕を招くこと。', tip:'過去問: 事例ⅢR1'},
  {cat:'kokkaku', q:'診断士助言型(事例Ⅰ・事例Ⅱ・事例Ⅲ)の解答の骨格は？ 例:「〇〇社長は〇〇を検討している。〇〇は〇〇をどのように進めるべきか、中小企業診断士として◯字以内で助言せよ。」', a:'〔原因・課題〕に対し、①〔施策(誰が・何を)〕、②〔施策〕を行い、〔効果=経営目的〕を図る。', tip:'過去問: R2〜R7の各事例で最多(R4事例Ⅰは5問中4問)'},
  {cat:'kokkaku', q:'ターゲット明示型(事例Ⅱ)の解答の骨格は？ 例:「〇〇は〇〇のために〇〇を活用したいと考えている。誰にどのような〇〇を行うべきか、ターゲットを明確にした上で◯字以内で助言せよ。」', a:'〔ターゲット(デモ・ジオ・サイコ・行動)〕に、〔強みを活かした商品・サービス〕を〔4Pの手段〕で提供し、〔効果(固定客化など)〕を図る。(ダナドコ)', tip:'過去問: 事例ⅡR3・R5'},
  {cat:'kokkaku', q:'条件付き提案型(事例Ⅱ・事例Ⅰ)の解答の骨格は？ 例:「〇〇。〇〇はどのような〇〇を行うべきか。〇〇、◯字以内で提案せよ。」', a:'〔条件を守った施策〕として、〔誰に〕〔何を〕〔どのように〕行い、〔効果〕を図る。', tip:'過去問: 事例ⅡR1価格プロモーション以外/R5割賦販売を除く/事例ⅠH30金銭的・物理的インセンティブ以外で'},
  {cat:'kokkaku', q:'観点指定助言型(事例Ⅱ・事例Ⅰ・事例Ⅲ)の解答の骨格は？ 例:「〇〇は〇〇を図りたいと考えている。どのような施策をとればよいか、〇〇と〇〇の観点から◯字以内で助言せよ。」', a:'〔観点A〕では〔施策〕、〔観点B〕では〔施策〕を行い、〔効果〕を図る。', tip:'過去問: 事例ⅡR4顧客ターゲットと品揃えの観点/R4商品コンセプトと販路を明確に'},
  {cat:'kokkaku', q:'フレームワーク指定型(事例Ⅱ)の解答の骨格は？ 例:「〇〇について、〇〇の考え方を使って◯字以内で〇〇せよ。」', a:'〔指定されたフレームの区分〕ごとに〔与件の事実・施策〕を当てはめ、〔効果〕で締める。', tip:'過去問: 事例ⅡR2アンゾフ/R6ブランド価値構造'},
  {cat:'kokkaku', q:'対象者別型(事例Ⅱ・事例Ⅰ)の解答の骨格は？ 例:「〇〇を導入する場合、(a)〇〇、(b)〇〇はそれぞれどのような取り組みを行うべきか。中小企業診断士として、それぞれ◯字以内で助言せよ。」', a:'(a)〔主体A〕は〔取組み〕により〔効果〕。(b)〔主体B〕は〔取組み〕により〔効果〕。', tip:'過去問: 事例ⅡR3フランチャイザー/フランチャイジー'},
  {cat:'kokkaku', q:'(a)問題点(b)対応策型(事例Ⅲ・事例Ⅰ)の解答の骨格は？ 例:「〇〇の〇〇で生じている(a)問題点と(b)その対応策について、それぞれ◯字以内で述べよ。」', a:'(a)問題点は①〔ネガティブな事実〕②〔ネガティブな事実〕。(b)対応策は①〔その原因をつぶす手段〕②〔手段〕により〔効果〕を図る。', tip:'過去問: 事例ⅢR2/事例ⅢH30作業方法・生産計画の問題点と改善策'},
  {cat:'kokkaku', q:'課題2つ+改善策型(事例Ⅲ)の解答の骨格は？ 例:「〇〇経営者は〇〇に取り組む方針である。そのために特に重要と思われる課題を2つあげ、各課題に対する改善策とともにそれぞれ◯字以内で述べよ。」', a:'各欄: 課題は〔ポジティブな目標=〜の削減・向上・安定化〕。改善策は①〔原因をつぶす手段〕②〔手段〕(により〔効果〕)。', tip:'過去問: 事例ⅢR3・R7。課題にネガティブな状態(=問題点)や手段を書かない。改善策で課題を繰り返さない(ふぞろい19「課題の繰り返しは加点なし」)。'},
  {cat:'kokkaku', q:'複数欄の形式で、2つの対応策が与件に書かれた1つの共通の経営目標(最終目的)に向かっているとき、その最終目的は両方の欄に書いてよい？', a:'両方の欄に書いてよい(むしろ書くべき)。各欄は「原因→対応策→効果」が独立して完結した1本の因果ストーリーである必要があり、採点基準も欄ごとに最終目的への言及を別個に見る。欄ごとに字数上限も別なので、同じ文言の重複は節約すべき共有リソースではない', tip:'2026-10-09 雫石木工(課題2つ+改善策型)の演習で「両方の欄に同じ効果を書くのは変では」と聞かれた場面。1つの欄にしか最終目的(工務店依存脱却・収益安定化)を書かないと、もう一方の欄は効果の点を取れない。'},
  {cat:'kokkaku', q:'課題+解決策型(事例Ⅰ・事例Ⅱ・事例Ⅲ)の解答の骨格は？ 例:「〇〇について、〇〇の課題を指摘したうえで解決策を◯字以内で述べよ。」', a:'課題は〔ポジティブな目標①〕と〔目標②〕。解決策は①〔原因に効く手段〕②〔手段〕を行い、〔効果〕を図る。', tip:'過去問: 事例ⅠR3長期的課題と解決策/事例ⅢR3製品企画面と生産面の課題/事例ⅢR4短納期化の課題と対応策・外部環境変化の中での課題'},
  {cat:'kokkaku', q:'リスク+対応策型(事例Ⅰ・事例Ⅲ)の解答の骨格は？ 例:「〇〇には、どのようなリスクがあるか。対応策を含めて◯字以内で説明せよ。」', a:'リスクは、〔与件根拠〕により〔直接的な悪影響(負担増・品質低下など)〕が生じ、〔経営への帰結〕を招くこと。対応策は〔行動〕である。', tip:'過去問: 事例ⅠH29全国展開の障害となるリスク(診断士の立場で助言)'},
  {cat:'kokkaku', q:'戦略的可能性型(事例Ⅲ・事例Ⅰ)の解答の骨格は？ 例:「〇〇社長が積極的に取り組みたいと考えている〇〇に応えることは、〇〇の今後の戦略にどのような可能性を持つのか、中小企業診断士として◯字以内で助」', a:'可能性は、①〔強みの活用・新たな能力の獲得〕、②〔新市場・新規顧客の獲得〕により、〔今後の戦略(依存からの脱却・成長)〕を実現できることである。', tip:'過去問: 事例ⅢR4'},
  {cat:'kokkaku', q:'整理・特徴型(事例Ⅱ・事例Ⅰ)の解答の骨格は？ 例:「〇〇のこれまでの〇〇について、◯字以内で整理せよ。」', a:'〔区分・時系列ごとの与件の事実①〕、〔②〕、〔③〕を、解釈を交えずに並べる。', tip:'過去問: 事例ⅡH28これまでの製品戦略を整理/事例ⅠH29少人数で運営できる経営体制の特徴'},
  {cat:'kokkaku', q:'比較型(事例Ⅰ)の解答の骨格は？ 例:「〇〇がそれ以前に手がけてきた〇〇の事業特性と、〇〇の事業特性には、どのような違いがあるか。◯字以内で答えよ。」', a:'〔事業A〕は〔特性(顧客・製品・取引形態)〕であるのに対し、〔事業B〕は〔対応する特性〕である。', tip:'過去問: 事例ⅠH30以前の製品と複写機関連製品の事業特性の違い'},
  {cat:'kokkaku', q:'事前整備型(事例Ⅲ)の解答の骨格は？ 例:「〇〇が検討している〇〇を進めるために、事前に整備しておくべき内容を◯字以内で述べよ。」', a:'事前に、①〔基準・業務手順の標準化〕、②〔データの整備・一元化〕、③〔体制・教育〕を整備する。', tip:'過去問: 事例ⅢH30生産管理のコンピュータ化の事前整備'},
  {cat:'kokkaku', q:'新事業提案+理由+社内対応策型(事例Ⅲ・事例Ⅱ)の解答の骨格は？ 例:「〇〇社長は〇〇のために新事業を計画しようとしている。中小企業診断士としてどのような新事業を提案するか、その理由、その事業を成功に導くために必」', a:'〔新事業〕を提案する。理由は〔強み・機会〕である。社内対応策は、①〔体制〕、②〔生産・技術面の取組み〕である。', tip:'過去問: 事例ⅢH28'},
  {cat:'kokkaku', q:'二択判断型(事例Ⅰ・事例Ⅲ・事例Ⅱ)の解答の骨格は？ 例:「〇〇社長は〇〇か、それとも〇〇か、悩んでいる。〇〇の経営資源を有効に活用するためにはどちらを選び、どのように対応するべきか、中小企業診断士と」', a:'〔案A/案B〕を選ぶ。理由は〔経営資源・与件根拠〕である。そのうえで〔対応策〕により〔効果〕を図る。', tip:'過去問: 事例ⅢR3'},
  {cat:'kokkaku', q:'二択判断型で、選ばなかった案の弱み(スタッフ不足など)しか書けず、選んだ案の理由が弱いとき、どこを見直す？', a:'選んだ案そのものが持つ経営資源(既存の会員基盤・設備・技術など)を与件から探し、「〔その資源〕をそのまま活用できる」という積極的な理由に言い換える。消極的理由(選ばなかった案の弱み)だけで終わらない', tip:'2026-10-09 谷地屋醸造(百貨店常設出店かECサイト強化か)の演習で14/20。「百貨店はスタッフ確保が困難」という消極的理由は書けたが、「ECは既存会員1,200名をそのまま活用できる」というEC側の資源の強みを理由に挙げられなかった。'},
  {cat:'kokkaku', q:'対応策の対象が「既存の会員・顧客」のとき、効果として書くべき方向性は？', a:'新規顧客の獲得ではなく、客単価の向上・リピート率(再購買率)の向上・固定客化など、既存顧客を深耕する方向の効果を書く', tip:'2026-10-09 谷地屋醸造の演習で、会員(既存顧客)への購買履歴分析による提案なのに効果が「固定客化」止まりで、客単価・リピート率向上という既存顧客向け施策らしい効果まで書けていなかった。'},
  {cat:'kokkaku', q:'妥当性+留意点型(事例Ⅲ・事例Ⅰ)の解答の骨格は？ 例:「〇〇社長は〇〇を目指そうとしている。この構想について、その妥当性とその理由、またその際の留意点を、中小企業診断士として◯字以内で助言せよ。」', a:'妥当である(妥当でない)。理由は〔与件根拠〕。留意点は〔リスク〕と〔その回避策〕である。', tip:'過去問: 事例ⅢR5'},
  {cat:'kokkaku', q:'留意点型(事例Ⅰ・事例Ⅲ)の解答の骨格は？ 例:「〇〇は〇〇に先立って、〇〇のどのような点に留意するべきか。◯字以内で助言せよ。」', a:'〔相手・対象〕との関係で、①〔留意点(依存度など)〕、②〔留意点(投資回収など)〕に留意し、〔確認・対応〕を行う。', tip:'過去問: 事例ⅠR5経営統合前の留意点/事例ⅠH28新規事業拡大の留意点(従来事業との違いを考慮)'},
  {cat:'kokkaku', q:'理由+提案型(事例Ⅰ・事例Ⅱ)の解答の骨格は？ 例:「〇〇なのはなぜか。理由を述べたうえで、対応策を◯字以内で提案せよ。」', a:'理由は、〔顧客側・自社側の原因〕である。対応策は、〔誰に〕〔何を〕〔どのように〕行い、〔効果〕を図る。', tip:'過去問: (ミニ問題で使ってきた型)'},
  {cat:'kokkaku', q:'計算+判断記述型(事例Ⅳ)の解答の骨格は？ 例:「計算した上で、採否・可否などの結論と理由を◯字以内で述べさせる。」', a:'〔結論(採用すべき/すべきでない)〕。理由は、〔計算結果〕が〔判断基準〕を上回る(下回る)ため。', tip:'過去問: H28第3問/H30第2問設問2/R5第2問・第3問'},
  {cat:'kokkaku', q:'経営分析型(指標+記述)(事例Ⅳ)の解答の骨格は？ 例:「2期間または同業他社のB/S・P/L(表で可)を示し、優れている指標・課題を示す指標を計〇〇つ挙げさせ(名称と値)、特徴や原因を◯字以内で述」', a:'〔与件根拠〕により〔指標〕が優れる一方、〔与件根拠〕により〔指標〕が劣る。', tip:'過去問: 10年連続で第1問'},
  {cat:'kokkaku', q:'記述型(事例Ⅳ)の解答の骨格は？ 例:「与件文(財務状況・計画中の施策を含む)+「〇〇について、◯字以内で述べよ(助言せよ/説明せよ)。」」', a:'〔与件の財務数値〕から〔財務的な影響・リスク〕があるため、〔対処(資金調達・固定費削減など)〕を行う。', tip:'過去問: R4第4問/R5第4問/R7第4問ほか'},
  {cat:'kokkaku', q:'記述型(事例Ⅳ)で、設問が「いつ〇〇すべきか」のように時期を問う助言のとき、結論と理由の順番はどう組む？', a:'通常の採否判断型(結論→理由は〜のため)と逆で、理由を先に積んでから文末で「〔理由①〕、〔理由②〕のため早期に(半年以内に)〇〇すべき」と結論(時期の答え)で締める。「いつ」の答えを結論の中に埋め込んで文末に置くと設問に直接答えた形になる', tip:'2026-10-09 気仙沼パン工房(郊外店の閉店時期を助言)の演習で模範解答「郊外店の営業損失が続き固定費負担が重く、短期借入金の返済期限も近いため早期に閉店すべき。」を見て、タツヤが「時期については理由を前に積んで最後に結論」という型に気づいた。'},
];

const CAT_LABELS = {
  all:'全部', danadoko:'ダナドコ', kechi:'けちのしぶき', sakusaku:'施策あるある5', keitashiri:'経多シリ', keishiki:'設問形式の見分け', ryuiten:'留意点型', kokkaku:'解答の骨格'
};

// ---------------- State ----------------
let currentCat = 'all';
let session = [];
let sIndex = 0;
let sScore = 0;
let revealed = false;
let stats = {}; // { "cat|q": {correct, total} }
let weakOnly = false;
let newestFirst = false;

const STORAGE_KEY = 'framework-drill-stats';
const WEAKONLY_KEY = 'framework-drill-weakonly';
const NEWESTFIRST_KEY = 'framework-drill-newestfirst';

const stage = document.getElementById('stage');
const tabsEl = document.getElementById('tabs');
const weakBox = document.getElementById('weakBox');
const weakList = document.getElementById('weakList');

function keyFor(item){ return item.cat + '|' + item.q; }

function isMastered(item){
  const s = stats[keyFor(item)];
  return !!(s && s.total >= 2 && s.correct === s.total);
}

function loadStats(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ stats = JSON.parse(raw); }
  }catch(e){ stats = {}; }
  try{ weakOnly = localStorage.getItem(WEAKONLY_KEY) === '1'; }catch(e){ weakOnly = false; }
  try{ newestFirst = localStorage.getItem(NEWESTFIRST_KEY) === '1'; }catch(e){ newestFirst = false; }
  renderTape();
  renderWeak();
}
function saveStats(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }
  catch(e){ /* storage unavailable, session-only fallback */ }
}

function renderTape(){
  const entries = Object.values(stats);
  if(entries.length === 0){
    document.getElementById('tapeMarks').textContent = 'まだ記録がありません';
    document.getElementById('tapeRate').textContent = '--%';
    return;
  }
  let totalC=0, totalT=0;
  entries.forEach(s=>{ totalC+=s.correct; totalT+=s.total; });
  const rate = totalT? Math.round(totalC/totalT*100) : 0;
  const log = (window.__drillLog || []).slice(-14);
  const marks = log.map(x=> x ? '<span class="ok">○</span>' : '<span class="ng">✕</span>').join(' ');
  document.getElementById('tapeMarks').innerHTML = marks || '記録あり・履歴は今回のセッションから表示';
  document.getElementById('tapeRate').textContent = '累計正答率 ' + rate + '%';
}

function renderWeak(){
  const arr = Object.entries(stats)
    .filter(([k,s]) => s.total >= 2)
    .map(([k,s]) => ({key:k, q:k.split('|')[1], cat:k.split('|')[0], rate: s.correct/s.total, total:s.total}))
    .sort((a,b)=> a.rate - b.rate)
    .slice(0,5);
  if(arr.length === 0){ weakBox.style.display='none'; return; }
  weakBox.style.display='block';
  weakList.innerHTML = arr.map(x=>`<div class="weak-item"><span>［${CAT_LABELS[x.cat]||x.cat}］${x.q}</span><b>${Math.round(x.rate*100)}%</b></div>`).join('');
}

function renderTabs(){
  const cats = ['all', ...Array.from(new Set(BANK.map(b=>b.cat)))];
  tabsEl.innerHTML = cats.map(c=>{
    const cnt = c==='all' ? BANK.length : BANK.filter(b=>b.cat===c).length;
    return `<div class="tab ${c===currentCat?'active':''}" data-cat="${c}">${CAT_LABELS[c]||c}<span class="cnt">(${cnt})</span></div>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{ currentCat = t.dataset.cat; renderTabs(); });
  });
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startSession(n){
  let pool = currentCat==='all' ? BANK : BANK.filter(b=>b.cat===currentCat);
  if(weakOnly) pool = pool.filter(b=>!isMastered(b));
  session = newestFirst ? pool.slice(-n).reverse() : shuffle(pool).slice(0, Math.min(n, pool.length));
  sIndex = 0; sScore = 0; revealed = false;
  window.__drillLog = [];
  renderCard();
}

function renderCard(){
  if(sIndex >= session.length){
    renderDone();
    return;
  }
  const item = session[sIndex];
  revealed = false;
  stage.innerHTML = `
    <div class="card">
      <div class="card-top">
        <span>${CAT_LABELS[item.cat]||item.cat}</span>
        <span class="progress">${sIndex+1} / ${session.length}</span>
      </div>
      <div class="qlabel">Q.</div>
      <div class="qtext">${item.q}</div>
      <hr class="divider">
      <div class="answer" id="ansBlock">
        <div class="alabel">A.</div>
        <div class="atext">${item.a}</div>
        ${item.tip ? `<div class="tip">💡 ${item.tip}</div>` : ''}
      </div>
      <button class="reveal-btn" id="revealBtn">答えを見る</button>
      <div class="judge-row" id="judgeRow" style="display:none;">
        <div class="jbtn ok" id="okBtn">○ 正解できた</div>
        <div class="jbtn ng" id="ngBtn">✕ 間違えた</div>
      </div>
    </div>
  `;
  document.getElementById('revealBtn').addEventListener('click', ()=>{
    document.getElementById('ansBlock').classList.add('show');
    document.getElementById('revealBtn').style.display='none';
    document.getElementById('judgeRow').style.display='flex';
  });
  document.getElementById('okBtn').addEventListener('click', ()=> judge(true));
  document.getElementById('ngBtn').addEventListener('click', ()=> judge(false));
}

function judge(correct){
  const item = session[sIndex];
  const k = keyFor(item);
  if(!stats[k]) stats[k] = {correct:0, total:0};
  stats[k].total += 1;
  if(correct){ stats[k].correct += 1; sScore += 1; }
  window.__drillLog.push(correct);
  saveStats();
  renderTape();
  sIndex += 1;
  renderCard();
}

function renderDone(){
  renderWeak();
  stage.innerHTML = `
    <div class="card done-card">
      <div class="eyebrow" style="margin-bottom:10px;">SESSION COMPLETE</div>
      <div class="big">${sScore} / ${session.length}</div>
      <p>お疲れさまでした。また隙間時間にどうぞ。</p>
      <button class="restart" id="restartBtn">もう一度（同じ条件で）</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    const n = session.length;
    startSession(n >= BANK.length ? 99 : n);
  });
}

// ---------------- Init ----------------
renderTabs();
loadStats();
stage.innerHTML = `
  <div class="card done-card">
    <div class="eyebrow" style="margin-bottom:10px;">READY</div>
    <div style="font-family:'Shippori Mincho',serif; font-size:16px; margin:8px 0 4px;">カテゴリを選んで、問題数を選択</div>
    <p>フレームワークの頭文字・要素・使いどころを中心に出題します。</p>
  </div>
`;
document.querySelectorAll('.sbtn').forEach(b=>{
  b.addEventListener('click', ()=> startSession(parseInt(b.dataset.n,10)));
});

const weakOnlyToggle = document.getElementById('weakOnlyToggle');
weakOnlyToggle.checked = weakOnly;
weakOnlyToggle.addEventListener('change', ()=>{
  weakOnly = weakOnlyToggle.checked;
  try{ localStorage.setItem(WEAKONLY_KEY, weakOnly ? '1' : '0'); }catch(e){}
});

const newestFirstToggle = document.getElementById('newestFirstToggle');
newestFirstToggle.checked = newestFirst;
newestFirstToggle.addEventListener('change', ()=>{
  newestFirst = newestFirstToggle.checked;
  try{ localStorage.setItem(NEWESTFIRST_KEY, newestFirst ? '1' : '0'); }catch(e){}
});

const syncArea = document.getElementById('syncArea');
const syncApplyBtn = document.getElementById('syncApplyBtn');
const syncMsg = document.getElementById('syncMsg');

document.getElementById('exportBtn').addEventListener('click', ()=>{
  syncArea.value = JSON.stringify(stats);
  syncArea.style.display = 'block';
  syncApplyBtn.style.display = 'none';
  syncArea.focus();
  syncArea.select();
  syncMsg.textContent = '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(syncArea.value)
      .then(()=>{ syncMsg.textContent = 'コピーしました。新しいバージョンの「進捗をインポート」に貼り付けてください。'; })
      .catch(()=>{ syncMsg.textContent = '下のテキストを選択してコピーしてください。'; });
  }else{
    syncMsg.textContent = '下のテキストを選択してコピーしてください。';
  }
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  syncArea.value = '';
  syncArea.style.display = 'block';
  syncApplyBtn.style.display = 'inline-block';
  syncArea.focus();
  syncMsg.textContent = '';
});

syncApplyBtn.addEventListener('click', ()=>{
  try{
    const imported = JSON.parse(syncArea.value);
    stats = Object.assign({}, stats, imported);
    saveStats();
    renderTape();
    renderWeak();
    syncMsg.textContent = '読み込みました（' + Object.keys(imported).length + '件）。';
  }catch(e){
    syncMsg.textContent = '読み込みに失敗しました。JSONの形式を確認してください。';
  }
});
</script>
</body>
</html>
