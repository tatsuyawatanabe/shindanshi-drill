<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>効果表現ドリル</title>
<style>
 @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

 :root{
 --paper:#F5EFE1;
 --paper-dark:#EDE4CE;
 --line:#CFC3A3;
 --ink:#26314A;
 --ink-soft:#5B5747;
 --accent:#7A4B3A;
 --moss:#4B6B4E;
 --gold:#B08A3E;
 --card-shadow: 0 1px 0 rgba(38,49,74,0.06);
 }

 *{box-sizing:border-box;}
 html,body{margin:0;padding:0;}
 body{
 background:
 repeating-linear-gradient(180deg, transparent, transparent 27px, var(--line) 28px),
 var(--paper);
 color:var(--ink);
 font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
 min-height:100vh;
 padding:18px 14px 60px;
 }

 .wrap{max-width:480px; margin:0 auto;}

 header{ text-align:center; padding:6px 0 14px; }
 .eyebrow{
 font-family:'Space Mono', monospace;
 font-size:11px; letter-spacing:.18em; color:var(--gold); text-transform:uppercase;
 }
 h1{
 font-family:'Shippori Mincho', serif; font-weight:700; font-size:23px;
 margin:4px 0 2px; color:var(--ink);
 }
 .sub{ font-size:12.5px; color:var(--ink-soft); }

 .back-link{
 display:inline-block; font-family:'Space Mono', monospace; font-size:11px;
 color:var(--ink-soft); text-decoration:none; margin-bottom:10px;
 }
 .back-link:active{ color:var(--ink); }

 .tape{
 margin-top:14px; background:#FBF8EF; border:1px solid var(--line); border-radius:2px;
 padding:10px 12px; font-family:'Space Mono', monospace; font-size:13px;
 color:var(--ink-soft); position:relative; box-shadow: var(--card-shadow);
 }
 .tape::before, .tape::after{
 content:""; position:absolute; left:0; right:0; height:6px;
 background-image: linear-gradient(45deg, var(--paper) 50%, transparent 50%), linear-gradient(-45deg, var(--paper) 50%, transparent 50%);
 background-size: 10px 6px; background-repeat:repeat-x;
 }
 .tape::before{ top:-6px; background-position: 0 6px;}
 .tape::after{ bottom:-6px; transform:rotate(180deg);}
 .tape-row{display:flex; justify-content:space-between; align-items:center;}
 .tape-marks{letter-spacing:3px; font-size:15px;}
 .tape-marks .ok{color:var(--moss);}
 .tape-marks .ng{color:#A23B2E;}
 .tape-rate{font-weight:700; color:var(--ink);}

 .tabs{ display:flex; flex-wrap:wrap; gap:6px; margin:16px 0 10px; }
 .tab{
 font-size:12.5px; padding:6px 10px; border:1px solid var(--line);
 background:var(--paper-dark); color:var(--ink-soft); border-radius:3px;
 cursor:pointer; user-select:none; transition:all .15s ease;
 }
 .tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
 .tab .cnt{opacity:.65; font-size:10.5px; margin-left:2px;}

 .session-row{display:flex; gap:8px; margin:6px 0 18px;}
 .sbtn{
 flex:1; font-family:'Space Mono', monospace; font-size:13px; padding:10px 4px;
 text-align:center; background:var(--paper); border:1px solid var(--ink); color:var(--ink);
 border-radius:3px; cursor:pointer;
 }
 .sbtn:active{ background:var(--ink); color:var(--paper); }
 .sbtn b{display:block; font-size:16px;}
 .sbtn span{font-size:9.5px; color:var(--ink-soft); font-family:'Zen Kaku Gothic New',sans-serif;}

 .stage{ min-height:360px; }
 .card{
 background:#FBF8EF; border:1px solid var(--line); border-radius:4px;
 padding:22px 20px 18px; box-shadow: var(--card-shadow); position:relative;
 }
 .card-top{
 display:flex; justify-content:space-between; align-items:center;
 font-family:'Space Mono', monospace; font-size:11px; color:var(--gold);
 letter-spacing:.06em; margin-bottom:14px;
 }
 .progress{ font-size:11px; color:var(--ink-soft); }
 .qlabel{ font-family:'Space Mono', monospace; font-size:11px; color:var(--ink-soft); margin-bottom:6px; }
 .qtext{
 font-family:'Shippori Mincho', serif; font-size:17px; line-height:1.7;
 color:var(--ink); min-height:50px;
 }
 .qlen{ font-family:'Space Mono', monospace; font-size:11px; color:var(--ink-soft); margin-top:6px; }
 .divider{ border:none; border-top:1px dashed var(--line); margin:16px 0; }
 .answer{ display:none; }
 .answer.show{ display:block; }
 .alabel{ font-family:'Space Mono', monospace; font-size:11px; color:var(--accent); margin-bottom:8px; }
 .kw-block{
 background:var(--paper-dark); border-left:3px solid var(--accent); padding:10px 12px;
 border-radius:2px; margin-bottom:8px;
 }
 .kw-block .tag{ font-size:10.5px; color:var(--ink-soft); margin-bottom:3px; }
 .kw-block .val{ font-size:15px; color:var(--ink); font-weight:700; }
 .why-block{
 background:var(--paper-dark); border-left:3px solid var(--moss); padding:10px 12px;
 border-radius:2px;
 }
 .why-block .tag{ font-size:10.5px; color:var(--ink-soft); margin-bottom:3px; }
 .why-block .val{ font-size:14px; color:var(--ink); line-height:1.6; }

 .reveal-btn{
 width:100%; margin-top:16px; background:var(--ink); color:var(--paper);
 border:none; border-radius:3px; padding:13px; font-size:14px; font-weight:700;
 font-family:'Zen Kaku Gothic New', sans-serif; cursor:pointer;
 }
 .judge-row{ display:flex; gap:10px; margin-top:14px; }
 .jbtn{
 flex:1; padding:12px; border-radius:3px; border:1px solid var(--line);
 font-size:14px; font-weight:700; cursor:pointer;
 font-family:'Zen Kaku Gothic New', sans-serif; background:var(--paper);
 }
 .jbtn.ok{ color:var(--moss); border-color:var(--moss); }
 .jbtn.ng{ color:#A23B2E; border-color:#A23B2E; }
 .jbtn.ok:active{ background:var(--moss); color:#fff; }
 .jbtn.ng:active{ background:#A23B2E; color:#fff; }

 .done-card{ text-align:center; padding:36px 20px; }
 .done-card .big{ font-family:'Space Mono', monospace; font-size:34px; font-weight:700; color:var(--ink); }
 .done-card p{ color:var(--ink-soft); font-size:13px; margin-top:6px;}
 .restart{
 margin-top:18px; width:100%; background:var(--paper); border:1px solid var(--ink); color:var(--ink);
 padding:12px; border-radius:3px; font-weight:700; cursor:pointer;
 font-family:'Zen Kaku Gothic New', sans-serif;
 }

 .weak-box{
 margin-top:22px; background:var(--paper-dark); border:1px solid var(--line);
 border-radius:4px; padding:14px 16px;
 }
 .weak-box h2{ font-family:'Shippori Mincho', serif; font-size:14px; margin:0 0 8px; }
 .weak-item{
 display:flex; justify-content:space-between; font-size:12px;
 padding:5px 0; border-bottom:1px dotted var(--line); color:var(--ink-soft);
 }
 .weak-item:last-child{border-bottom:none;}
 .weak-item b{color:#A23B2E;}

 .opt-row{ margin:2px 0 12px; }
 .opt-toggle{
 display:flex; align-items:center; gap:8px;
 font-size:12.5px; color:var(--ink-soft); cursor:pointer; user-select:none;
 }
 .opt-toggle input{ accent-color:var(--ink); width:15px; height:15px; }

 .sync-box{
 margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
 display:flex; gap:8px; flex-wrap:wrap; align-items:center;
 }
 .sync-btn{
 font-family:'Zen Kaku Gothic New', sans-serif; font-size:11.5px;
 padding:7px 10px; background:var(--paper); border:1px solid var(--line);
 color:var(--ink-soft); border-radius:3px; cursor:pointer;
 }
 .sync-btn:active{ background:var(--paper-dark); }
 .sync-area{
 width:100%; margin-top:2px; font-family:'Space Mono', monospace; font-size:10.5px;
 padding:8px; border:1px solid var(--line); border-radius:3px; background:#FBF8EF; color:var(--ink);
 resize:vertical;
 }
 .sync-msg{ font-size:11px; color:var(--moss); }

 footer{
 text-align:center; margin-top:26px; font-size:10.5px; color:var(--ink-soft);
 font-family:'Space Mono', monospace;
 }
</style>
</head>
<body>
<div class="wrap">

 <header>
 <a class="back-link" href="index.html">← ドリル一覧に戻る</a>
 <div class="eyebrow">EFFECT DRILL</div>
 <h1>効果表現ドリル</h1>
 <div class="sub">「〜止まり」の弱い効果表現を見て、経営目的まで一段深掘りした着地表現を思い出す練習。事例Ⅰ〜Ⅲで繰り返し指摘されてきた「効果が浅い」弱点への対策。</div>
 </header>

 <div class="tape">
 <div class="tape-row">
 <span id="tapeMarks" class="tape-marks">まだ記録がありません</span>
 <span id="tapeRate" class="tape-rate">--%</span>
 </div>
 </div>

 <div class="tabs" id="tabs"></div>

 <div class="opt-row">
 <label class="opt-toggle"><input type="checkbox" id="weakOnlyToggle"> 苦手優先モード（習得済み[連続2回正解]の問題を除外）</label>
 </div>
 <div class="opt-row">
 <label class="opt-toggle"><input type="checkbox" id="newestFirstToggle"> 新しい問題から解く（追加順・シャッフルなし）</label>
 </div>

 <div class="session-row">
 <div class="sbtn" data-n="5"><b>5問</b><span>約3分</span></div>
 <div class="sbtn" data-n="10"><b>10問</b><span>約5〜7分</span></div>
 <div class="sbtn" data-n="99"><b>全問</b><span>事例集中</span></div>
 </div>

 <div class="stage" id="stage"></div>

 <div class="weak-box" id="weakBox" style="display:none;">
 <h2>苦手リスト（正答率が低い順）</h2>
 <div id="weakList"></div>
 </div>

 <div class="sync-box">
 <button class="sync-btn" id="exportBtn">📤 進捗をエクスポート</button>
 <button class="sync-btn" id="importBtn">📥 進捗をインポート</button>
 <textarea class="sync-area" id="syncArea" style="display:none;" rows="3" placeholder="ここに進捗JSONを貼り付けて「読み込む」を押す"></textarea>
 <button class="sync-btn" id="syncApplyBtn" style="display:none;">読み込む</button>
 <span class="sync-msg" id="syncMsg"></span>
 </div>

 <footer>「効果が浅い・止まり」弱点対策用オリジナル例文 &middot; 記録は端末(localStorage)に保存されます。新しいバージョンをもらったら「進捗をエクスポート」→次のバージョンで「進捗をインポート」で引き継げます。</footer>
</div>

<script>
// ---------------- Question bank ----------------
const BANK = [
 // 事例Ⅰ：組織・人事
 {cat:'j1', before:'技術レベルの向上', after:'技術レベルの向上により、新規事業を軌道に乗せ受注機会を拡大する', tip:'内部効果(技術向上)止まりで終わらせず、それが売上・受注拡大等の経営目的にどう繋がるかまで書く(2026-09-24金属溶接加工業D社で「技術レベルの向上」止まりと指摘)。'},
 {cat:'j1', before:'従業員の不満を解消する', after:'従業員の不満を解消し定着率を高めることで技能承継を可能にする', tip:'内部効果(不満解消)止まりで終わらせず、定着・技能承継など一段上の目的につなげる(2026-09-24・09-25で複数回指摘した継続弱点)。'},
 {cat:'j1', before:'人員不足を発生させない体制を作る', after:'人員不足を防ぎ、増加する需要を取りこぼさず対応することで地域からの信頼を維持する', tip:'内部維持目的止まりでなく、機会損失回避・信頼維持など対外的な経営目的まで書く(2026-09-25調剤薬局チェーンH社)。'},
 {cat:'j1', before:'情報共有の仕組みを整える', after:'情報共有の仕組みを整え、紹介ルートを明確化することで受注機会の取りこぼしを防ぐ', tip:'人・教育系(情報共有)の施策だけで終わらせず、仕組み・体制面の変更まで踏み込む(2026-09-23介護老人保健施設P社)。'},
 {cat:'j1', before:'新人が育つ環境を整える', after:'新人が育つ環境を整え、複数チームでの並行対応を可能にし受注拡大につなげる', tip:'育成そのもので終わらせず、それによって何ができるようになるか(体制面の変化)まで書く(2026-09-27住宅リフォームX社)。'},

 // 事例Ⅱ：マーケティング・流通
 {cat:'j2', before:'商品の魅力を訴求する', after:'商品の魅力を訴求し固定客化を図る', tip:'「訴求」で終わらせず「固定客化」まで着地させる。事例Ⅱで最も繰り返し指摘されてきた継続弱点(2026-09-23〜09-27で複数回発生)。'},
 {cat:'j2', before:'ファン層を増やす', after:'ファン層を増やし固定客化・リピート化につなげる', tip:'「ファンを増やす」止まりでなく固定客化まで一段深掘りする(2026-09-27ペット用品P社で発生)。'},
 {cat:'j2', before:'新規顧客を獲得する', after:'新規顧客を獲得し固定客化を図る', tip:'ダナドコの「効果」は新規顧客化だけで終わらせず、固定客化とセットで書くのが基本形。'},
 {cat:'j2', before:'SNSでの認知度を高める', after:'SNSでの認知度を高め、来店・購入につなげ固定客化を図る', tip:'認知だけで終わらせず、来店・購入という顧客の行動、さらに固定客化まで接続する。'},
 {cat:'j2', before:'商品選択肢を増やす', after:'品揃えを充実させ来店客が求める商品を選びやすくする', tip:'施策(品揃え拡充)の直接的な結果の言い換えで終わらせず、顧客が選びやすくなる・買いやすくなるという行動・体験まで一歩踏み込む(2026-09-27ペット用品P社)。'},

 // 事例Ⅲ：生産・技術
 {cat:'j3', before:'確認に時間がかかる', after:'確認に時間がかかり、トレーサビリティ要件を満たせず失注するリスクがある', tip:'表面的な事象(時間がかかる)止まりでなく、失注・市場回収範囲の拡大など重大な帰結まで踏み込む(2026-09-24金属熱処理加工業G社・2026-09-26EMS受託製造業K社)。'},
 {cat:'j3', before:'生産計画の滞りを防止する', after:'生産計画の滞りを防止し、医療機器の安定受注につなげる', tip:'社内都合(滞り防止)止まりでなく、受注実現・顧客対応など事業目的への接続まで書く(2026-08-22精密金属部品受託加工C社)。'},
 {cat:'j3', before:'不良率のばらつきを抑える', after:'不良率のばらつきを抑え、新規部品の量産化に対応できる体制を構築する', tip:'品質改善そのもので終わらせず、量産化・新規受注対応など事業目的まで接続する。'},
 {cat:'j3', before:'段取り時間を短縮する', after:'段取り時間を短縮し、多品種少量生産への対応力を高め受注機会を拡大する', tip:'手段の直接効果(時間短縮)で終わらせず、対応力向上・受注拡大など上位の目的まで書く(2026-09-27精密板金加工業Q社)。'},
];

const CAT_LABELS = { all:'全部', j1:'事例Ⅰ', j2:'事例Ⅱ', j3:'事例Ⅲ' };

// ---------------- State ----------------
let currentCat = 'all';
let session = [];
let sIndex = 0;
let sScore = 0;
let stats = {};
let weakOnly = false;
let newestFirst = false;

const STORAGE_KEY = 'effect-drill-stats';
const WEAKONLY_KEY = 'effect-drill-weakonly';
const NEWESTFIRST_KEY = 'effect-drill-newestfirst';

const stage = document.getElementById('stage');
const tabsEl = document.getElementById('tabs');
const weakBox = document.getElementById('weakBox');
const weakList = document.getElementById('weakList');

function keyFor(item){ return item.cat + '|' + item.before.slice(0,14); }

function isMastered(item){
 const s = stats[keyFor(item)];
 return !!(s && s.total >= 2 && s.correct === s.total);
}

function loadStats(){
 try{
 const raw = localStorage.getItem(STORAGE_KEY);
 if(raw){ stats = JSON.parse(raw); }
 }catch(e){ stats = {}; }
 try{ weakOnly = localStorage.getItem(WEAKONLY_KEY) === '1'; }catch(e){ weakOnly = false; }
 try{ newestFirst = localStorage.getItem(NEWESTFIRST_KEY) === '1'; }catch(e){ newestFirst = false; }
 renderTape();
 renderWeak();
}
function saveStats(){
 try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(stats)); }
 catch(e){ /* storage unavailable, session-only fallback */ }
}

function renderTape(){
 const entries = Object.values(stats);
 if(entries.length === 0){
 document.getElementById('tapeMarks').textContent = 'まだ記録がありません';
 document.getElementById('tapeRate').textContent = '--%';
 return;
 }
 let totalC=0, totalT=0;
 entries.forEach(s=>{ totalC+=s.correct; totalT+=s.total; });
 const rate = totalT? Math.round(totalC/totalT*100) : 0;
 const log = (window.__drillLog || []).slice(-14);
 const marks = log.map(x=> x ? '<span class="ok">○</span>' : '<span class="ng">✕</span>').join(' ');
 document.getElementById('tapeMarks').innerHTML = marks || '記録あり・履歴は今回のセッションから表示';
 document.getElementById('tapeRate').textContent = '累計正答率 ' + rate + '%';
}

function renderWeak(){
 const arr = Object.entries(stats)
 .filter(([k,s]) => s.total >= 2)
 .map(([k,s]) => ({key:k, rate: s.correct/s.total, total:s.total, label:s.label||k}))
 .sort((a,b)=> a.rate - b.rate)
 .slice(0,5);
 if(arr.length === 0){ weakBox.style.display='none'; return; }
 weakBox.style.display='block';
 weakList.innerHTML = arr.map(x=>`<div class="weak-item"><span>${x.label}</span><b>${Math.round(x.rate*100)}%</b></div>`).join('');
}

function renderTabs(){
 const cats = ['all','j1','j2','j3'];
 tabsEl.innerHTML = cats.map(c=>{
 const cnt = c==='all' ? BANK.length : BANK.filter(b=>b.cat===c).length;
 return `<div class="tab ${c===currentCat?'active':''}" data-cat="${c}">${CAT_LABELS[c]}<span class="cnt">(${cnt})</span></div>`;
 }).join('');
 tabsEl.querySelectorAll('.tab').forEach(t=>{
 t.addEventListener('click', ()=>{ currentCat = t.dataset.cat; renderTabs(); });
 });
}

function shuffle(arr){
 const a = arr.slice();
 for(let i=a.length-1;i>0;i--){
 const j = Math.floor(Math.random()*(i+1));
 [a[i],a[j]] = [a[j],a[i]];
 }
 return a;
}

function startSession(n){
 let pool = currentCat==='all' ? BANK : BANK.filter(b=>b.cat===currentCat);
 if(weakOnly) pool = pool.filter(b=>!isMastered(b));
 session = newestFirst ? pool.slice(-n).reverse() : shuffle(pool).slice(0, Math.min(n, pool.length));
 sIndex = 0; sScore = 0;
 window.__drillLog = [];
 renderCard();
}

function renderCard(){
 if(sIndex >= session.length){ renderDone(); return; }
 const item = session[sIndex];
 stage.innerHTML = `
 <div class="card">
 <div class="card-top">
 <span>${CAT_LABELS[item.cat]}</span>
 <span class="progress">${sIndex+1} / ${session.length}</span>
 </div>
 <div class="qlabel">効果表現（止まり）</div>
 <div class="qtext">${item.before}</div>
 <div class="qlen">この効果、どこまで一段深掘りして着地させる？</div>
 <hr class="divider">
 <div class="answer" id="ansBlock">
 <div class="alabel">着地表現の例</div>
 <div class="kw-block">
 <div class="tag">深掘り後</div>
 <div class="val">${item.after}</div>
 </div>
 <div class="why-block">
 <div class="tag">なぜこの深掘りが必要か</div>
 <div class="val">${item.tip}</div>
 </div>
 </div>
 <button class="reveal-btn" id="revealBtn">着地表現を見る</button>
 <div class="judge-row" id="judgeRow" style="display:none;">
 <div class="jbtn ok" id="okBtn">○ 思いつけた</div>
 <div class="jbtn ng" id="ngBtn">✕ 思いつけなかった</div>
 </div>
 </div>
 `;
 document.getElementById('revealBtn').addEventListener('click', ()=>{
 document.getElementById('ansBlock').classList.add('show');
 document.getElementById('revealBtn').style.display='none';
 document.getElementById('judgeRow').style.display='flex';
 });
 document.getElementById('okBtn').addEventListener('click', ()=> judge(true));
 document.getElementById('ngBtn').addEventListener('click', ()=> judge(false));
}

function judge(correct){
 const item = session[sIndex];
 const k = keyFor(item);
 if(!stats[k]) stats[k] = {correct:0, total:0, label:'['+CAT_LABELS[item.cat]+']'+item.before.slice(0,16)+'…'};
 stats[k].total += 1;
 if(correct){ stats[k].correct += 1; sScore += 1; }
 window.__drillLog.push(correct);
 saveStats();
 renderTape();
 sIndex += 1;
 renderCard();
}

function renderDone(){
 renderWeak();
 stage.innerHTML = `
 <div class="card done-card">
 <div class="eyebrow" style="margin-bottom:10px;">SESSION COMPLETE</div>
 <div class="big">${sScore} / ${session.length}</div>
 <p>お疲れさまでした。また隙間時間にどうぞ。</p>
 <button class="restart" id="restartBtn">もう一度（同じ条件で）</button>
 </div>
 `;
 document.getElementById('restartBtn').addEventListener('click', ()=>{
 const n = session.length;
 startSession(n >= BANK.length ? 99 : n);
 });
}

// ---------------- Init ----------------
renderTabs();
loadStats();
stage.innerHTML = `
 <div class="card done-card">
 <div class="eyebrow" style="margin-bottom:10px;">READY</div>
 <div style="font-family:'Shippori Mincho',serif; font-size:16px; margin:8px 0 4px;">事例を選んで、問題数を選択</div>
 <p>弱い効果表現を読んで、経営目的まで一段深掘りした着地表現を思い出せるか試します。</p>
 </div>
`;
document.querySelectorAll('.sbtn').forEach(b=>{
 b.addEventListener('click', ()=> startSession(parseInt(b.dataset.n,10)));
});

const weakOnlyToggle = document.getElementById('weakOnlyToggle');
weakOnlyToggle.checked = weakOnly;
weakOnlyToggle.addEventListener('change', ()=>{
 weakOnly = weakOnlyToggle.checked;
 try{ localStorage.setItem(WEAKONLY_KEY, weakOnly ? '1' : '0'); }catch(e){}
});

const newestFirstToggle = document.getElementById('newestFirstToggle');
newestFirstToggle.checked = newestFirst;
newestFirstToggle.addEventListener('change', ()=>{
 newestFirst = newestFirstToggle.checked;
 try{ localStorage.setItem(NEWESTFIRST_KEY, newestFirst ? '1' : '0'); }catch(e){}
});

const syncArea = document.getElementById('syncArea');
const syncApplyBtn = document.getElementById('syncApplyBtn');
const syncMsg = document.getElementById('syncMsg');

document.getElementById('exportBtn').addEventListener('click', ()=>{
 syncArea.value = JSON.stringify(stats);
 syncArea.style.display = 'block';
 syncApplyBtn.style.display = 'none';
 syncArea.focus();
 syncArea.select();
 syncMsg.textContent = '';
 if(navigator.clipboard && navigator.clipboard.writeText){
 navigator.clipboard.writeText(syncArea.value)
 .then(()=>{ syncMsg.textContent = 'コピーしました。新しいバージョンの「進捗をインポート」に貼り付けてください。'; })
 .catch(()=>{ syncMsg.textContent = '下のテキストを選択してコピーしてください。'; });
 }else{
 syncMsg.textContent = '下のテキストを選択してコピーしてください。';
 }
});

document.getElementById('importBtn').addEventListener('click', ()=>{
 syncArea.value = '';
 syncArea.style.display = 'block';
 syncApplyBtn.style.display = 'inline-block';
 syncArea.focus();
 syncMsg.textContent = '';
});

syncApplyBtn.addEventListener('click', ()=>{
 try{
 const imported = JSON.parse(syncArea.value);
 stats = Object.assign({}, stats, imported);
 saveStats();
 renderTape();
 renderWeak();
 syncMsg.textContent = '読み込みました（' + Object.keys(imported).length + '件）。';
 }catch(e){
 syncMsg.textContent = '読み込みに失敗しました。JSONの形式を確認してください。';
 }
});
</script>
</body>
</html>
